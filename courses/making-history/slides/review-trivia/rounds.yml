# Read out after the last round. Each team writes a number on its last sheet;
# the closest breaks a tie.
tiebreak:
  q: Livy wrote 142 books of Roman history. How many survive?
  a: "35"
  source: Week 2 · books 1–10 and 21–45 survive; the rest are known from ancient summaries
