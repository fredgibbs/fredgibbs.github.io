<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<title>{{ page.title }}</title>

		<link rel="stylesheet" href="/assets/vendor/reveal.js-3.8.0/css/reset.css">
		<link rel="stylesheet" href="/assets/vendor/reveal.js-3.8.0/css/reveal.css">
		<link rel="stylesheet" href="/assets/vendor/reveal.js-3.8.0/css/theme/black.css">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
		<link rel="stylesheet" href="/assets/css/reveal-lecture-theme.css">
		{% if page.image_slides %}<link rel="stylesheet" href="/assets/css/reveal-image-slide.css">{% endif %}

		<script>
			var link = document.createElement( 'link' );
			link.rel = 'stylesheet';
			link.type = 'text/css';
			link.href = window.location.search.match( /print-pdf/gi ) ? '/assets/vendor/reveal.js-3.8.0/css/print/pdf.css' : '/assets/vendor/reveal.js-3.8.0/css/print/paper.css';
			document.getElementsByTagName( 'head' )[0].appendChild( link );
		</script>
	</head>
	<body>
		<div class="reveal">
			<div class="slides">

{{ content }}

			</div>
		</div>

		<script src="/assets/vendor/reveal.js-3.8.0/js/reveal.js"></script>
		<script>
			Reveal.initialize({
				hash: true,
				controlsTutorial: false,
				progress: true,
				center: true,
				width: 960,
				height: 700,
				margin: 0.08,
				dependencies: [
					{ src: '/assets/vendor/reveal.js-3.8.0/plugin/markdown/marked.js' },
					{ src: '/assets/vendor/reveal.js-3.8.0/plugin/markdown/markdown.js' },
					{ src: '/assets/vendor/reveal.js-3.8.0/plugin/notes/notes.js', async: true },
					{ src: '/assets/vendor/reveal.js-3.8.0/plugin/highlight/highlight.js', async: true }
				]
			});
		</script>
	</body>
</html>
